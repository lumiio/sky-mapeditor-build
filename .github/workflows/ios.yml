name: ios-unsigned-ipa

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Compile Metal shaders
        run: |
          mkdir -p ios/Resources/Shaders
          xcrun -sdk iphoneos metal -c ios/Shaders/Scene.metal -o /tmp/Scene.air
          xcrun -sdk iphoneos metallib /tmp/Scene.air -o ios/Resources/Shaders/default.metallib
          ls -lh ios/Resources/Shaders/default.metallib

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project SkyMapEditor.xcodeproj \
            -scheme SkyMapEditor \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned .ipa
        run: |
          mkdir -p out/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/SkyMapEditor.app out/Payload/
          cd out && zip -qry SkyMapEditor-unsigned.ipa Payload
          ls -lh SkyMapEditor-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SkyMapEditor-unsigned-ipa
          path: out/SkyMapEditor-unsigned.ipa


  # 出货前自测：把同一个工程编到 iOS 模拟器里真跑一遍，读 App 自己写的 boot.log 探针，
  # 只要"地面75%/天空10%"两处像素还等于 clearColor(0.030,0.050,0.090)，就判定"一帧都没画上去"，直接失败不让出货。
  sim-qa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Compile Metal shaders (simulator)
        run: |
          mkdir -p ios/Resources/Shaders
          xcrun -sdk iphonesimulator metal -c ios/Shaders/Scene.metal -o /tmp/Scene.air
          xcrun -sdk iphonesimulator metallib /tmp/Scene.air -o ios/Resources/Shaders/default.metallib

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for simulator
        working-directory: ios
        run: |
          xcodebuild -project SkyMapEditor.xcodeproj \
            -scheme SkyMapEditor \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Boot simulator and run app
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 qa/pick_sim.py)
          echo "UDID=$UDID" | tee /tmp/udid.txt
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/build-sim/Build/Products/Release-iphonesimulator/SkyMapEditor.app
          xcrun simctl launch "$UDID" com.skyeditor.metal
          sleep 25
          xcrun simctl io "$UDID" screenshot /tmp/qa-shot.png
          ls -l /tmp/qa-shot.png

      - name: Dump boot.log
        run: |
          DATA=$(xcrun simctl get_app_container "$UDID" com.skyeditor.metal data)
          echo "container: $DATA"
          ls -l "$DATA/Documents" || true
          cp "$DATA/Documents/boot.log" /tmp/qa-boot.log || true
          echo "-------- boot.log --------"
          cat /tmp/qa-boot.log || true

      - name: Assert something actually rendered
        run: python3 qa/check_probe.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-simulator
          path: |
            /tmp/qa-shot.png
            /tmp/qa-boot.log
